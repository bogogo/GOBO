name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-hsd130]
    paths: ['app/**', '.github/workflows/macos-app.yml']

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          # Mixing Swift packages and CocoaPods breaks video_player's build here, so use CocoaPods only.
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build macos --release
      - name: Zip
        run: |
          cd app/build/macos/Build/Products/Release
          ditto -c -k --keepParent gobo.app "$GITHUB_WORKSPACE/GOBO-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GOBO-mac
          path: GOBO-mac.zip
